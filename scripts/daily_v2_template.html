<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Curio · 今日字段与中文标题</title>
<style>
:root{color-scheme:light;--ink:#233e34;--muted:#6e7771;--green:#38614e;--paper:#f3f2ec}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 system-ui,-apple-system,sans-serif}header,main{max-width:1440px;margin:auto;padding:28px 32px}header{padding-bottom:8px}.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--green)}h1{font-size:34px;line-height:1.25;margin:12px 0}h2{font-size:19px;line-height:1.55;margin:12px 0}p{margin:10px 0}.intro{max-width:1000px;color:var(--muted)}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.stat{background:#fff;padding:13px 20px;border-radius:10px;min-width:125px}.stat b{display:block;font-size:25px}.stat span{font-size:13px;color:var(--muted)}nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}button,input,select,.download{font:inherit;padding:9px 13px;border:1px solid #c7cec6;border-radius:7px;background:#fff;color:var(--ink)}input{flex:1;min-width:190px}button{cursor:pointer}button:disabled{opacity:.4}a{color:#35664e}.download{text-decoration:none;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;align-items:start}.card{background:#fff;border:1px solid #e0e3da;border-radius:12px;overflow:hidden}.visual{height:255px;background:#f9faf7;padding:12px;display:flex;align-items:center;justify-content:center}.visual img{width:100%;height:100%;object-fit:contain}.body{padding:19px}.meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}.badge{color:#30604a;background:#edf3ea;padding:3px 7px;border-radius:4px}.price{font-size:21px;font-weight:650}.sub,.note{font-size:12px;color:var(--muted)}.reason{background:#f4f6f0;border-left:3px solid #9fb99a;padding:9px 11px;font-size:13px}.warning{color:#8e492d}.facts{display:grid;grid-template-columns:75px 1fr;gap:5px 10px;font-size:13px;margin:14px 0}.facts dt{color:var(--muted)}.facts dd{margin:0;overflow-wrap:anywhere}details{border-top:1px solid #e5e8df;margin-top:13px;padding-top:10px}summary{cursor:pointer;font-size:13px;font-weight:600}table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;table-layout:fixed}td{border-bottom:1px solid #e9ece5;vertical-align:top;padding:7px 4px;overflow-wrap:anywhere}td:first-child{width:38%;color:var(--muted)}code{font-size:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 system-ui;max-height:360px;overflow:auto}blockquote{margin:8px 0;padding:8px 12px;background:#f6f7f3;font-size:12px}footer{padding:30px;text-align:center;color:var(--muted);font-size:12px}.pagination{justify-content:center;margin:28px 0}.empty{padding:50px}.pill{background:#f9efe5;padding:3px 7px;border-radius:5px;font-size:11px} @media(max-width:600px){header,main{padding:20px 14px}.grid{grid-template-columns:1fr}h1{font-size:28px}}
</style>
<header><div class="eyebrow">Curio / Product Schema V2</div><h1>今日商品 · 中文标题与初筛</h1><p class="intro" id="intro"></p><p class="intro">标题按「磕碰／修复等状态 → 年代（有则写）→ 品牌 → 卖家等级 → 装饰与器型 → 规格／组成」生成。一等、二等直接沿用卖家陈述，年代未知省略；原文和完整字段可展开查看。</p><div class="stats" id="stats"></div><nav><select id="bucket"><option>优先复核</option><option>次级候选</option><option>资料待补</option><option>暂不优先</option><option>规则排除</option><option>已人工审核</option><option>已下架</option><option>全部</option></select><select id="platform"><option>全部平台</option><option>ebay</option><option>kleinanzeigen</option></select><input id="search" aria-label="搜索" placeholder="搜索中文标题、原文、器型或编号"><a class="download" href="完整字段与初筛.json" download>完整字段 JSON</a><a class="download" href="中文标题清单.txt" download>中文标题清单</a></nav><p class="sub" id="count"></p></header>
<main><div id="cards" class="grid"></div><nav class="pagination"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></nav></main><footer>价格为来源当前标价或竞拍价，不是采购成本或建议买价。客户证据沿用 10 月 5 日索引，历史需求仍须核实。此页为本次结果快照。</footer>
<script>
const D=__DATA__,$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=s=>{try{let u=new URL(s);return ['http:','https:'].includes(u.protocol)?esc(u.href):'#'}catch{return '#'}};
const val=v=>v===null||v===undefined?'未知 / 未核验':typeof v==='object'?JSON.stringify(v,null,2):String(v);
let page=0;
$('intro').textContent=`${D.summary.date} · 柏林时间当天首次入库 ${D.summary.items} 条 · 截至 ${new Date(D.summary.captured_at).toLocaleString('zh-CN',{timeZone:'Europe/Berlin'})}。今日首次发现不等于今日上架。`;
$('stats').innerHTML=Object.entries(D.summary.buckets).map(([k,v])=>`<div class="stat"><b>${v}</b><span>${esc(k)}</span></div>`).join('');
if(!D.summary.buckets['优先复核'])$('bucket').value='全部';
function render(){let b=$('bucket').value,p=$('platform').value,q=$('search').value.toLowerCase();let rows=D.results.filter(r=>(b==='全部'||r.bucket===b)&&(p==='全部平台'||r.item.platform===p)&&(!q||JSON.stringify([r.title_preview_zh,r.item.title,r.item.item_id,r.candidate_product.object_type]).toLowerCase().includes(q)));let pages=Math.max(1,Math.ceil(rows.length/24));page=Math.max(0,Math.min(page,pages-1));$('count').textContent=`当前 ${rows.length} 条 · 每页 24 条 · 点开「全部 75 字段」检查整理结果`;$('page').textContent=`${page+1} / ${pages}`;$('prev').disabled=page===0;$('next').disabled=page===pages-1;
$('cards').innerHTML=rows.slice(page*24,page*24+24).map(r=>{const i=r.item,c=r.candidate_product;let shown=D.field_definitions.filter(f=>c[f.field]!=null&&!['raw_title','raw_description','external_refs','created_at','updated_at','product_id','source_types'].includes(f.field));let core=[['制造者',c.maker],['卖家等级',r.seller_grade?.label],['器型',r.object_label_zh],['主装饰',c.pattern_name],['主体',c.subjects?.join('、')],['尺寸',c.measurement_notes],['组成',c.components?c.components.map(x=>x.type+' × '+x.quantity).join(' / '):c.sale_piece_count?c.sale_piece_count+' 件，成员未核':'未核验']];return `<article class="card">${i.image?`<div class="visual"><img loading="lazy" referrerpolicy="no-referrer" src="${safe(i.image)}" alt="商品来源照片；未作图片鉴定" onerror="this.alt='来源图片暂不可用，可打开原商品链接'"></div>`:''}<div class="body"><div class="meta"><span class="badge">${esc(r.bucket)}</span><span>${esc(i.platform)}</span></div><h2>${esc(r.title_preview_zh)}</h2><span class="pill">${esc(r.title_status)}</span><p class="price">价格：${esc(i.listed_price??'待询价')} ${esc(i.currency)} <span class="sub">${/auction/i.test(i.buying||'')?'竞拍当前价':'卖家标价'}</span></p><p class="reason">${esc(r.reason)}</p><dl class="facts">${core.filter(([_,v])=>v!=null).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl><a href="${safe(i.url)}" target="_blank" rel="noopener noreferrer">查看原商品 ↗</a><details><summary>整理说明与待核问题</summary>${r.notes.map(s=>`<p class="note">${esc(s)}</p>`).join('')}<p class="note">详情获取：${esc(r.detail_status)} · 字段词表：${esc(r.vocabulary_version)}</p></details><details><summary>全部 ${D.field_definitions.length} 字段（候选层）</summary><table>${D.field_definitions.map(f=>`<tr><td>${esc(f.label)}<br><code>${esc(f.field)}</code></td><td>${esc(val(c[f.field]))}</td></tr>`).join('')}</table><p class="note">product_title 留空等待人工确认；页面中文标题保存在 title_preview_zh。采购成本和目标售价均未用来源标价代填。</p></details><details><summary>初筛客户依据（${r.customer_evidence_count} 条）</summary>${r.customer_evidence.map(e=>`<p class="sub">${esc(e.customer_id)} · ${esc(e.kind)} · ${e.strong?'具体匹配':'部分线索'}</p><blockquote>${esc(e.text)}</blockquote><p class="note">${esc(e.date||'日期未核')} · 未满足：${esc(e.unmet_requirements.join('、')||'已提取特征未发现缺项；其余仍待核')}<br>${esc(e.caveat)}</p>`).join('')||'<p class="note">未找到足够具体的客户证据。</p>'}</details><details><summary>原始标题、详情与字段证据</summary><p>${esc(i.title)}</p><pre>${esc(c.raw_description||'未取得商品描述')}</pre><details><summary>逐字段提取记录 ${r.inferences.length} 条</summary><pre>${esc(JSON.stringify(r.inferences,null,2))}</pre></details></details></div></article>`}).join('')||'<p class="empty">没有符合筛选条件的结果。</p>';
}
for(const k of ['bucket','platform','search'])$(k).addEventListener('input',()=>{page=0;render()});$('prev').onclick=()=>{page--;render();window.scrollTo(0,0)};$('next').onclick=()=>{page++;render();window.scrollTo(0,0)};render();
</script></html>
