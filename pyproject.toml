[project]
name = "curiobject"
version = "0.1.0"
description = "Curiobject：西洋瓷器货源采集、筛选与审核（Mac 本地权威端）"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.31,<3",
    "PyYAML>=6,<7",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
