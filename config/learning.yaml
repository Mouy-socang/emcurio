# 05 待审核（故事 17，CAP-8、FR-18、FR-19）：从墨墨的人工拣选归纳规律的参数。
# 本文件只是数据；归纳在 curio/learning.py，已确认规律只由 curio/rules.py 执行（AD-15）。不调用 AI。
#
# 计数只看人工的留下、去掉、捞回（捞回算"留下"方向）；撤销的不计；同一件货按最后一次人工方向计一次。
# 分组特征只取自标准名称：品牌、器型（功能）、图案，外画标记与价格区间是可选附加维。

# 同一组合、同一方向至少几件才提出。
min_count: 5
# 该方向占该组合全部人工决定的比例（0–1）。
min_ratio: 0.8
# 已确认的留下类规律：同组合新货的规则基础分加多少（0–50）。
keep_bonus: 10
# 价格区间（按卖家标价，只比该币种的货）：分界从小到大，如 [50, 150, 400] 即 €50 以下、€50–150、€150–400、€400 以上。
price_bands:
  currency: EUR
  edges: [50, 150, 400]
