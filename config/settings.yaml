keywords:
  - Meissen
  - KPM Berlin
auction_fee_rate: 0.0
cheap_damaged_max: null
daily_budget: 0
kleinanzeigen_enabled: true
status_check_limit: 200
# 商品池（留下、在售）的货距上次检查满这么多小时，下一轮在普通在售轮转之前优先再查（1–48，故事 26）。
pool_check_hours: 6
# 每平台每日外部请求上限（含 OAuth、重试），按柏林日期归零；低于官方上限。
# 新货抓取最多用 60%，在售检查保底 40%；用完当天跳过该平台。
api_budget:
  ebay: 4500
  etsy: 4500          # 账号额度 5000/天、5 次/秒（请求间隔 ≥0.2 秒，由 curio/etsy.py 保证）
  kleinanzeigen: 1500
# EM 西洋瓷器知识库（标准名称词表来源，只读；Curiobject 从不写入）。
em_kb_path: ~/Desktop/EM 西洋瓷器
# CAP-4 AI 打分（claude-haiku-5-5，需 .env 的 ANTHROPIC_API_KEY）：每日 HTTP 请求上限（含重试），按柏林日期归零。
# 每次请求最多给 20 件货打分；默认 100 次/天约每月 €3–5（最坏约 €25，按 1 美元≈0.9 欧元估算），明细见 README（AD-20：每月合计 €200 上限）；0 = 不启用。
ai_budget:
  requests_per_day: 400
# 后台 06 客人（故事 14，AD-12）：GoodCustomer 资料库与它自带的 gcdb.py。Curiobject 只读档案（customer.json），
# 新建档案只经 `gcdb.py --db <资料库> new-customer --name …`，从不直接写资料库里的任何文件。
goodcustomer:
  db: ~/Desktop/goodcustomerDB
  gcdb: ~/Desktop/goodcustomer-plugin/skills/gc-schema/scripts/gcdb.py
# 故事 30：发布快照版本。1 = snapshot.v1（现状）；2 = snapshot.v2（多带拍卖榜 R12_auction 与拍卖货结束时间，
# 客人页普通榜下出现「拍卖中」一栏）。服务器部署能读 v2 的版本之前保持 1。
publish:
  snapshot_version: 1
