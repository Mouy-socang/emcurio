<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Curio · 找货审核</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f4f0;color:#263d34;font:16px system-ui}header,main{max-width:1200px;margin:auto;padding:24px}h1{margin:0;font-size:30px}small,.meta{color:#69746e}nav{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}button,input,textarea{font:inherit}button{border:1px solid #d4dad5;border-radius:18px;padding:9px 16px;background:white;color:#263d34;cursor:pointer}button.active,button.primary{background:#294f3d;color:white}button:disabled{opacity:.45;cursor:default}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}.card{background:white;border-radius:18px;overflow:hidden;box-shadow:0 3px 10px #00000006}.photo{height:240px;background:#e8ebe5;position:relative}.photo img{width:100%;height:100%;object-fit:contain}.price{position:absolute;bottom:12px;left:12px;background:#fffffff2;padding:6px 10px;border-radius:10px;font-size:15px;font-weight:650}.body{padding:16px}h2{font-size:17px;line-height:1.45;margin:0 0 12px}.meta{font-size:13px}.reason{font-size:14px;line-height:1.6;min-height:44px}.actions{display:flex;gap:6px;margin-top:16px}.actions button{flex:1;padding:8px 6px}a{color:#315b45}#empty{padding:50px 10px;text-align:center;color:#69746e}footer{display:flex;align-items:center;justify-content:center;gap:20px;margin:30px}dialog{border:0;border-radius:24px;padding:28px;width:min(92vw,530px);color:#263d34}dialog::backdrop{background:#13291c66;backdrop-filter:blur(4px)}label{display:block;margin:16px 0 6px}input,textarea{width:100%;padding:12px;border:1px solid #cbd2cb;border-radius:12px}textarea{height:100px}.row{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}#error{color:#a22}#status{font-size:13px;margin-top:12px;overflow-wrap:anywhere}@media(max-width:580px){header,main{padding:16px}#grid{grid-template-columns:1fr}.photo{height:300px}}
</style>
<header><h1>Curio <small>找货审核</small></h1><p>先看有希望的，再把你的判断留下来。</p><div id="status"></div><nav><button data-tab="pending" class="active">待审核</button><button data-tab="excluded">被规则排除</button><button data-tab="reviewed">已审核</button><button id="refresh">刷新</button></nav></header>
<main><div id="grid"></div><div id="empty" hidden></div><footer><button id="prev">上一页</button><span id="pagination"></span><button id="next">下一页</button></footer></main>
<dialog id="dialog"><form id="form"><h2 id="heading"></h2><p id="title"></p><label for="reason">判断原因 <span id="required"></span></label><textarea id="reason" maxlength="2000" placeholder="例如：太贵；纹饰好卖；需要确认品相"></textarea><label for="fair">你觉得多少钱合适？<span id="currency"></span></label><input id="fair" type="number" min="0" step="0.01" placeholder="心理价（选填）"><p id="error" role="alert"></p><div class="row"><button type="button" id="cancel">取消</button><button class="primary" id="submit">保存判断</button></div></form></dialog>
<script>
const token='__TOKEN__',labels={want:'要',probe:'询市',skip:'不要'},$=id=>document.getElementById(id);let tab='pending',page=1,rows=[],choice,selected,requestId;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=s=>/^https?:\/\//i.test(s||'')?esc(s):'';
const price=(p,c)=>p==null?'价格待询':`${Number(p).toFixed(2)} ${esc(c)}`;
async function load(){try{const r=await fetch(`/api/items?tab=${tab}&page=${page}`),d=await r.json();if(!r.ok)throw Error(d.error);if(!d.items.length&&page>1){page--;return load()}rows=d.items;$('status').textContent=(d.import_note?d.import_note+' ':'')+'上次采集：'+d.last_collection+' · 模型预算默认 0'+(d.collection_result?' · '+d.collection_result:'');$('grid').innerHTML=rows.map((p,i)=>`<article class="card"><div class="photo">${safe(p.image)?`<img src="${safe(p.image)}" alt="${esc(p.title)}" loading="lazy" referrerpolicy="no-referrer">`:''}<span class="price">${price(p.listed_price,p.currency)}</span></div><div class="body"><h2>${esc(p.title)}</h2><div class="meta">${esc(p.platform)} · 总价 ${price(p.total_price,p.currency)} · ${({active:'在售待核验',gone:'已下架',archived:'已归档'})[p.status]||esc(p.status)}${p.owner_decision?' · 你选了'+labels[p.owner_decision]:''}</div><p class="reason">${labels[p.agent_decision]}：${esc(p.agent_reason)}</p><a href="${safe(p.url)}" target="_blank" rel="noopener noreferrer">查看原商品 ↗</a><div class="actions">${Object.entries(labels).map(([k,v])=>`<button data-item="${i}" data-choice="${k}">${v}</button>`).join('')}</div></div></article>`).join('');$('empty').hidden=!!rows.length;$('empty').textContent=tab==='pending'?'没有待审核商品。采集完成后，有希望的商品会出现在这里。':'这个分类暂无商品。';$('pagination').textContent=`第 ${page} 页 · 共 ${d.total} 件`;$('prev').disabled=page===1;$('next').disabled=page*d.size>=d.total}catch(e){$('status').textContent='加载失败，请确认本地服务正在运行。'}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;page=1;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));load()});$('refresh').onclick=load;$('prev').onclick=()=>{page--;load()};$('next').onclick=()=>{page++;load()};
$('grid').onclick=e=>{const b=e.target.closest('[data-item]');if(!b)return;selected=rows[Number(b.dataset.item)];choice=b.dataset.choice;requestId=crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();$('heading').textContent='选择「'+labels[choice]+'」';$('title').textContent=selected.title;$('reason').value='';$('reason').required=choice==='skip';$('required').textContent=choice==='skip'?'（必填）':'（选填）';$('fair').value='';$('currency').textContent='（'+selected.currency+'）';$('error').textContent='';$('dialog').showModal()};$('cancel').onclick=()=>$('dialog').close();
$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;try{const r=await fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json','X-Curio-Token':token},body:JSON.stringify({item_id:selected.item_id,decision:choice,reason:$('reason').value,fair_price:$('fair').value,rule_version:selected.rule_version,request_id:requestId})}),d=await r.json();if(!r.ok)throw Error(d.error);$('dialog').close();await load()}catch(e){$('error').textContent=e.message}finally{$('submit').disabled=false}};load();
</script></html>
