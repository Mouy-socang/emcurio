<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Curio · 下架资料整理</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(120deg,#bd5720,#c86b3d 55%,#bf5722);color:#382b23;font:16px Avenir,'PingFang SC',sans-serif;min-height:100vh}main{max-width:1300px;margin:auto;padding:30px}header{display:flex;gap:15px;align-items:center;flex-wrap:wrap}a{color:inherit}button,input,textarea{font:inherit;border:1px solid #96785d;border-radius:10px;padding:10px;background:#f4e8db;color:inherit}button{cursor:pointer}input[type=search]{flex:1;min-width:200px}article[hidden]{display:none}article{margin:22px 0;padding:24px;background:rgba(255,249,239,.65);backdrop-filter:blur(20px);border-radius:20px;display:grid;grid-template-columns:240px 1fr;gap:24px}.cover{width:100%;max-height:300px;object-fit:contain;border-radius:12px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;font-weight:600}textarea{width:100%;margin-top:5px;min-height:72px;font-weight:400;resize:vertical}small,.note{font-size:14px;line-height:1.6}details{margin:14px 0}summary{cursor:pointer}.gallery{display:flex;gap:12px;flex-wrap:wrap}.gallery img{width:180px;height:160px;object-fit:contain;background:#fff5}.actions{display:flex;gap:12px;align-items:center;margin-top:15px}.state{font-weight:bold}.notice{background:#fff9;padding:16px;border-radius:14px;line-height:1.7}pre{white-space:pre-wrap;font:inherit;font-size:14px}h2{font-size:20px;margin-top:0}@media(max-width:720px){main{padding:15px}article{grid-template-columns:1fr;padding:18px}.cover{height:200px}.fields{grid-template-columns:1fr}}
</style><main><header><a href="/old">← 返回 Curio</a><h1>下架资料整理</h1><input id="search" type="search" placeholder="搜索品牌、器型、图案"><button id="export">导出当前整理 JSON</button></header><p class="notice">首批 20 件 · Codex 结合已保存原图、卖家原文与本地瓷器知识库整理。全部初始为待审核候选，品牌及年代不等于鉴定结论；下架不等于成交，价格保留挂牌／拍卖出价性质。功能按咖啡杯碟、深盘、花瓶等功能词表记录；器型记录厂家器型名称及口沿、把手、足部等形制，未知不硬配。可以直接修改中文字段，保存后自动形成独立审核记录。</p><p id="status">正在读取…</p><section id="records"></section></main><script>
const labels={'功能':'功能（功能词表）','器型':'器型（厂家名称与形制）'};
const token='__TOKEN__',keys=['品牌','年代','功能','器型','图案','是否带金边','品相','数量','价格'];let rows=[];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const imagePath=x=>/^images\/[a-f0-9]{64}\.(jpg|png|webp)$/.test(x)?'/archive/'+x:'';
function render(){const q=document.querySelector('#search').value.toLowerCase();document.querySelector('#records').innerHTML=rows.filter(p=>JSON.stringify(p).toLowerCase().includes(q)).map(p=>{const d=p.data,s=p.snapshot,f=p.reviewed_fields||Object.fromEntries(keys.map(k=>[k,d.fields[k].value]));return `<article data-id="${p.id}"><div><a href="${imagePath(s.images[0].file)}" target="_blank"><img class="cover" src="${imagePath(s.images[0].file)}" alt="商品原图"></a><p>快照 ${d.snapshot_id} · ${d.source_status==='gone'?'已下架':'已归档'}<br><span class="state">${p.reviewed_fields?'已保存人工审核':'待审核候选'}</span></p></div><div><h2>${esc(s.title)}</h2><div class="fields">${keys.map(k=>`<label>${labels[k]||k}<textarea data-field="${k}" maxlength="4000">${esc(f[k])}</textarea></label>`).join('')}</div><p class="note">${d.review_notes.map(esc).join('<br>')}</p><details><summary>全部原图（${s.images.length} 张）</summary><div class="gallery">${s.images.map(im=>`<a target="_blank" href="${imagePath(im.file)}"><img loading="lazy" src="${imagePath(im.file)}" alt="保存原图"></a>`).join('')}</div></details><details><summary>卖家原文和判断依据</summary><pre>${esc(JSON.stringify(d.seller_claims,null,2))}</pre>${d.classification_axes?`<p>功能与器型分别记录：</p><pre>${esc(JSON.stringify(d.classification_axes,null,2))}</pre>`:''}<p>图像观察与卖家说法均保留为候选。知识库只用于比对，不直接确认为商品事实。</p>${d.knowledge_references.map(r=>`<p>${esc(r.path)}<br><small>${esc(r.use)}</small></p>`).join('')}<p>原始价格记录：</p><pre>${esc(JSON.stringify(d.price_record,null,2))}</pre></details><label>审核说明<textarea data-note maxlength="2000" placeholder="可记录纠正原因或尚未确认的问题"></textarea></label><div class="actions"><button data-save="${p.id}">保存我的审核</button><span class="saved" role="status"></span></div></div></article>`}).join('')}
async function load(){const r=await fetch('/api/archive-classifications');if(!r.ok)throw Error('读取失败');rows=(await r.json()).results;render();document.querySelector('#status').textContent=`已整理 ${rows.length} 件；修改后请逐件保存。`}
document.querySelector('#search').addEventListener('input',()=>{const q=document.querySelector('#search').value.toLowerCase();for(const a of document.querySelectorAll('article')){const row=rows.find(x=>x.id===Number(a.dataset.id));a.hidden=!(JSON.stringify(row)+' '+[...a.querySelectorAll('[data-field]')].map(x=>x.value).join(' ')).toLowerCase().includes(q)}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-save]');if(!b)return;const article=b.closest('article'),fields=Object.fromEntries([...article.querySelectorAll('[data-field]')].map(x=>[x.dataset.field,x.value]));b.disabled=true;try{const r=await fetch('/api/archive-classifications/review',{method:'POST',headers:{'Content-Type':'application/json','X-Curio-Token':token},body:JSON.stringify({id:Number(b.dataset.save),fields,note:article.querySelector('[data-note]').value})});const d=await r.json();if(!r.ok)throw Error(d.error);rows.find(x=>x.id===Number(b.dataset.save)).reviewed_fields=fields;article.querySelector('.state').textContent='已保存人工审核';article.querySelector('.saved').textContent='已保存，原始候选保留'}catch(err){article.querySelector('.saved').textContent=err.message}finally{b.disabled=false}});
document.querySelector('#export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(rows,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='Curio-下架资料整理.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};load().catch(e=>document.querySelector('#status').textContent=e.message);
</script></html>
